{% extends 'tramites/base.html' %}
{% block titulo %}Nuevo Comunicado{% endblock %}
{% block topbar_titulo %}Nuevo Comunicado{% endblock %}
{% block topbar_acciones %}
    <a href="{% url 'comunicados_lista' %}" class="btn btn-secondary">← Volver</a>
{% endblock %}

{% block content %}
<div class="card" style="max-width:700px">
    <div class="card-header">📢 Publicar Comunicado</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group full">
                    <label class="form-label">Título</label>
                    <input type="text" name="titulo" class="form-control" required placeholder="Ej: Cronograma de pagos - Semestre 2026-I">
                </div>
                <div class="form-group">
                    <label class="form-label">Tipo</label>
                    <select name="tipo" class="form-control">
                        <option value="general">General</option>
                        <option value="academico">Académico</option>
                        <option value="financiero">Financiero</option>
                        <option value="urgente">Urgente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Destinatarios</label>
                    <select name="destinatario" class="form-control" id="dest-select" onchange="toggleCarrera()">
                        <option value="todos">Todos</option>
                        <option value="alumnos">Solo Alumnos</option>
                        <option value="docentes">Solo Docentes</option>
                        <option value="carrera">Por Carrera</option>
                    </select>
                </div>
                <div class="form-group" id="carrera-field" style="display:none">
                    <label class="form-label">Carrera</label>
                    <select name="carrera" class="form-control">
                        <option value="">— Seleccionar —</option>
                        {% for c in carreras %}
                        <option value="{{ c.id }}">{{ c.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group full">
                    <label class="form-label">Mensaje</label>
                    <textarea name="cuerpo" class="form-control" rows="6" required placeholder="Redacta el comunicado aquí..."></textarea>
                </div>
            </div>
            <div class="form-actions">
                <a href="{% url 'comunicados_lista' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">📢 Publicar</button>
            </div>
        </form>
    </div>
</div>

<script>
function toggleCarrera() {
    const sel = document.getElementById('dest-select').value;
    document.getElementById('carrera-field').style.display = sel === 'carrera' ? 'block' : 'none';
}
</script>
{% endblock %}
